<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392">
  <title>Our locations platform</title>
  <!-- Standalone colours (e.g. viewed on GitHub). The training page strips this block and applies its theme. -->
  <style>
    .dg-bg { fill: #ffffff; }
    .dg-grp { stroke-width: 1.5; }
    .k8s { fill: #e9eeff; stroke: #3b5bdb; }
    .node { fill: #e5f5ed; stroke: #1f8a5b; }
    .flux { fill: #f2ecff; stroke: #7a4fd6; }
    .git { fill: #fdf1e2; stroke: #b25e09; }
    .dg-box { fill: #ffffff; stroke: #d5dae3; stroke-width: 1.2; }
    .dg-box.hl { stroke: #3b5bdb; stroke-width: 2; }
    .dg-box.pod { stroke: #1f8a5b; stroke-width: 1.5; }
    .dg-arrow { fill: none; stroke: #5a6376; stroke-width: 1.8; }
    .dg-head { fill: #5a6376; }
    text { font-family: Inter, system-ui, sans-serif; fill: #151922; }
    .dg-t { font-size: 17px; font-weight: 600; }
    .dg-s { font-size: 13px; fill: #5a6376; }
    .dg-d { font-size: 12.5px; fill: #5a6376; }
    .dg-l { font-size: 12.5px; font-weight: 600; fill: #3b5bdb; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
  </style>
  <defs>
    <marker id="dgi-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="dg-bg" width="960" height="392"/>

  <!-- What we provide: everything we touch -->
  <rect class="dg-grp k8s" x="10" y="10" width="940" height="264" rx="14"/>
  <text class="dg-t" x="28" y="38">Locations system</text>
  <text class="dg-s" x="28" y="58">IOPEDGE · IOP Turing Lee team</text>

  <rect class="dg-box hl" x="28" y="136" width="380" height="90" rx="10"/>
  <text class="dg-t" x="44" y="175">Microservices</text>
  <text class="dg-d" x="44" y="197">connect Azure and the clusters</text>

  <rect class="dg-box" x="500" y="26" width="432" height="64" rx="10"/>
  <text class="dg-t" x="518" y="52">Azure</text>
  <text class="dg-d" x="518" y="74">Cosmos DB, Event Hubs, Kubernetes…</text>

  <rect class="dg-grp node" x="500" y="104" width="432" height="154" rx="14"/>
  <text class="dg-t" x="518" y="130">Clusters</text>
  <text class="dg-s" x="518" y="150">where the workloads run</text>
  <rect class="dg-box pod" x="518" y="162" width="190" height="82" rx="10"/>
  <text class="dg-t" x="613" y="209" text-anchor="middle">Stores</text>
  <rect class="dg-box pod" x="724" y="162" width="190" height="82" rx="10"/>
  <text class="dg-t" x="819" y="209" text-anchor="middle">Warehouses</text>

  <!-- How the environment is operated: teams release on their own, through Git -->
  <rect class="dg-box" x="10" y="306" width="200" height="70" rx="12"/>
  <text class="dg-t" x="26" y="336">Inditex teams</text>
  <text class="dg-d" x="26" y="358">release their versions</text>

  <rect class="dg-grp git" x="290" y="306" width="290" height="70" rx="12"/>
  <text class="dg-t" x="308" y="336">Git</text>
  <text class="dg-d" x="308" y="358">desired state</text>

  <rect class="dg-grp flux" x="650" y="306" width="300" height="70" rx="12"/>
  <text class="dg-t" x="668" y="336">Flux</text>
  <text class="dg-d" x="668" y="358">reconciles the clusters automatically</text>

  <!-- Arrows, drawn last so the arrowheads stay on top -->
  <path class="dg-arrow" d="M408 166C456 166 450 58 498 58" marker-end="url(#dgi-head)"/>
  <path class="dg-arrow" d="M408 181H498" marker-end="url(#dgi-head)"/>
  <path class="dg-arrow" d="M210 341H288" marker-end="url(#dgi-head)"/>
  <text class="dg-l" x="249" y="331" text-anchor="middle">push</text>
  <path class="dg-arrow" d="M580 341H648" marker-end="url(#dgi-head)"/>
  <path class="dg-arrow" d="M800 306V260" marker-end="url(#dgi-head)"/>
</svg>
