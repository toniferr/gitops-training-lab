<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 322">
  <title>Las cinco capas de la cadena GitOps: código, imagen, registry, GitOps y Kubernetes</title>
  <!-- Standalone colours (e.g. viewed on GitHub). The training page strips this block and applies its theme. -->
  <!-- Simplified twin of gitops-pipeline.es.svg: same layers, labels and arrows, without the inner boxes. -->
  <style>
    .dg-bg { fill: #ffffff; }
    .dg-grp { stroke-width: 1.5; }
    .k8s { fill: #e9eeff; stroke: #3b5bdb; }
    .flux { fill: #f2ecff; stroke: #7a4fd6; }
    .git { fill: #fdf1e2; stroke: #b25e09; }
    .oci { fill: #e2f4f6; stroke: #0b7a85; }
    .dg-arrow { fill: none; stroke: #5a6376; stroke-width: 1.8; }
    .dg-arrow.dash { stroke-dasharray: 6 4; }
    .dg-head { fill: #5a6376; }
    text { font-family: Inter, system-ui, sans-serif; fill: #151922; }
    .dg-t { font-size: 17px; font-weight: 600; }
    .dg-s { font-size: 13px; fill: #5a6376; }
    .dg-l { font-size: 12.5px; font-weight: 600; fill: #3b5bdb; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
  </style>
  <defs>
    <marker id="dgps-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="dg-bg" width="660" height="322"/>

  <!-- Layer 1 -->
  <rect class="dg-grp git" x="10" y="10" width="600" height="46" rx="12"/>
  <text class="dg-t" x="28" y="39">1 · Código</text>
  <text class="dg-s" x="170" y="38">repo java-api-gitops · lo escribe el equipo</text>
  <text class="dg-l" x="592" y="38" text-anchor="end">CI</text>
  <path class="dg-arrow" d="M110 56V72" marker-end="url(#dgps-head)"/>
  <text class="dg-l" x="124" y="69">docker build</text>

  <!-- Layer 2 -->
  <rect class="dg-grp oci" x="10" y="74" width="600" height="46" rx="12"/>
  <text class="dg-t" x="28" y="103">2 · Imagen</text>
  <text class="dg-s" x="170" y="102">docker build · Dockerfile multi-stage</text>
  <text class="dg-l" x="592" y="102" text-anchor="end">CI</text>
  <path class="dg-arrow" d="M110 120V136" marker-end="url(#dgps-head)"/>
  <text class="dg-l" x="124" y="133">docker push</text>

  <!-- Layer 3 -->
  <rect class="dg-grp oci" x="10" y="138" width="600" height="46" rx="12"/>
  <text class="dg-t" x="28" y="167">3 · Registry</text>
  <text class="dg-s" x="170" y="166">docker push · en el lab: kind load</text>
  <text class="dg-l" x="592" y="166" text-anchor="end">CI</text>
  <path class="dg-arrow" d="M110 184V200" marker-end="url(#dgps-head)"/>
  <text class="dg-l" x="124" y="197">tag en el YAML · git push</text>

  <!-- Layer 4 -->
  <rect class="dg-grp flux" x="10" y="202" width="600" height="46" rx="12"/>
  <text class="dg-t" x="28" y="231">4 · GitOps</text>
  <text class="dg-s" x="170" y="230">Flux en flux-system · Git → API de Kubernetes</text>
  <text class="dg-l" x="592" y="230" text-anchor="end">CD</text>
  <path class="dg-arrow" d="M110 248V264" marker-end="url(#dgps-head)"/>
  <text class="dg-l" x="124" y="261">controladores de Kubernetes</text>

  <!-- Layer 5 -->
  <rect class="dg-grp k8s" x="10" y="266" width="600" height="46" rx="12"/>
  <text class="dg-t" x="28" y="295">5 · Kubernetes</text>
  <text class="dg-s" x="170" y="294">namespace java-api · lo que de verdad corre</text>
  <text class="dg-l" x="592" y="294" text-anchor="end">CD</text>

  <!-- Image pull: from the registry layer to the Kubernetes layer -->
  <path class="dg-arrow dash" d="M610 161H632V289H612" marker-end="url(#dgps-head)"/>
  <text class="dg-l" x="642" y="225" text-anchor="middle" transform="rotate(90 642 225)">kubelet descarga la imagen</text>
</svg>
