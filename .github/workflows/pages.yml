# Publishes the training websites to GitHub Pages.
#
# Any push to main or to a training/* branch rebuilds the whole site from all
# branches (scripts/site/build-pages.sh), so every edition stays published.
# One-time setup is described in site/README.md.
name: Pages

on:
  push:
    branches:
      - main
      - 'training/**'
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs; .github/dependabot.yml keeps them updated.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0              # every branch, not just the one pushed
          persist-credentials: false  # the build only reads; don't leave a token in .git/config

      - name: Build site from all training branches
        run: sh scripts/site/build-pages.sh _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
